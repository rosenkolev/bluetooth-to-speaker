name: Release Drafter

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      # write permission is required to create a github release
      contents: write
      # write permission is required for auto-labeler
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      # Drafts the next release notes as pull requests are merged into "main".
      # Publishing the draft creates the tag, which builds and publishes the release images.
      - uses: release-drafter/release-drafter@v7
        with:
          # Pull requests only label and preview; the draft is updated from main.
          dry-run: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
