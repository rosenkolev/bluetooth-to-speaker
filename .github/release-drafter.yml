name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
change-template: "- #$NUMBER - $TITLE (@$AUTHOR)"
categories:
  - title: "⚠ Breaking Changes"
    semver-increment: major
    when:
      label: "breaking-change"
  - title: "✨ Features"
    semver-increment: minor
    when:
      labels:
        - "feature"
        - "enhancement"
  - title: "🐛 Fixes"
    when:
      labels:
        - "bug"
        - "fix"
  - title: "⬆️ Dependencies"
    collapse-after: 1
    when:
      label: "dependencies"
  - type: "version-resolver"
    semver-increment: patch
autolabeler:
  - labels: ["dependencies"]
    files: ["Cargo.lock"]
  - labels: ["documentation"]
    files: ["*.md", "docs/**"]
template: |
  ## What’s Changed

  $CHANGES

  **Image:** `ghcr.io/rosenkolev/bluetooth-to-speaker:$RESOLVED_VERSION`
