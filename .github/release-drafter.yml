name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
change-template: "- #$NUMBER - $TITLE (@$AUTHOR)"
categories:
  - title: "⚠ Breaking Changes"
    labels:
      - "breaking-change"
  - title: "✨ Features"
    labels:
      - "feature"
      - "enhancement"
  - title: "🐛 Fixes"
    labels:
      - "bug"
      - "fix"
  - title: "⬆️ Dependencies"
    collapse-after: 1
    labels:
      - "dependencies"
version-resolver:
  major:
    labels: ["breaking-change"]
  minor:
    labels: ["feature", "enhancement"]
  default: patch
autolabeler:
  - label: "dependencies"
    files: ["Cargo.lock"]
  - label: "documentation"
    files: ["*.md", "docs/**"]
template: |
  ## What’s Changed

  $CHANGES

  **Image:** `ghcr.io/rosenkolev/bluetooth-to-speaker:$RESOLVED_VERSION`
