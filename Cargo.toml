[package]
name = "bluetooth-to-speaker"
version = "0.1.0"
edition = "2021"
description = "Turn a Linux board into a Bluetooth speaker (A2DP sink) with a web UI, MQTT and DLNA renderer"
license = "MIT"
authors = ["Rosen Kolev"]
repository = "https://github.com/rosenkolev/bluetooth-to-speaker"
readme = "README.md"
rust-version = "1.85"
publish = false

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time", "signal", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
alsa = "0.12"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
rumqttc = { version = "0.24", default-features = false }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "wav", "pcm", "ogg", "vorbis"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
socket2 = { version = "0.5", features = ["all"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
